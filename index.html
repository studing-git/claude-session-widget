<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow:hidden;background:#1a1a1a;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none;border-radius:14px;border:1px solid #2e2e2e;}

/* 트래픽라이트 */
.wb{border-radius:50%;border:none;cursor:pointer;color:transparent;font-size:0;}
.wb.mn{background:#f5a623;}
.wb.cl{background:#ff5f57;}

/* 아이콘 버튼 */
.iBtn{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;transition:color .15s,background .15s;line-height:1;}
.iBtn:hover{color:#ccc;background:#2a2a2a;}
.iBtn:disabled{opacity:.35;cursor:not-allowed;}

/* 툴팁 */
.tip{position:relative;}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#2c2c2c;color:#ccc;font-size:10px;padding:4px 9px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid #3a3a3a;z-index:99;}
.tip:hover::after{opacity:1;}

@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;border:2px solid #2e2e2e;border-top-color:#d97706;border-radius:50%;animation:spin .7s linear infinite;}
.state-box{text-align:center;color:#666;line-height:1.7;width:100%;}
.login-btn{display:inline-block;margin-top:10px;padding:6px 16px;background:#d97706;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;}

/* ── 일반 모드 580px ── */
#uiFull{width:580px;display:block;}
.tb-full{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 9px;border-bottom:1px solid #2a2a2a;cursor:move;}
.body-full{display:flex;padding:16px 14px;gap:6px;}
.card-full{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 1px 12px;background:#252525;border-radius:10px;border:1px solid #2e2e2e;transition:border-color .3s,background .3s;}
.clabel{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:600;}
.ring-wrap-full{position:relative;width:76px;height:76px;cursor:default;}
.ring-wrap-full svg{width:76px;height:76px;display:block;}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.rpct-full{font-size:16px;font-weight:700;color:#f0f0f0;}
.rtxt{font-size:9px;color:#888;text-align:center;line-height:1.6;}
.rval{font-size:10px;color:#aaa;font-weight:500;}
.divv{width:1px;background:#2a2a2a;align-self:stretch;flex-shrink:0;}
.footer-full{display:flex;justify-content:flex-start;align-items:center;padding:8px 16px 12px;border-top:1px solid #2a2a2a;}

/* ── 미니 모드 160px ── */
#uiMini{width:160px;display:none;}
.tb-mini{display:flex;justify-content:space-between;align-items:center;padding:7px 10px 6px;border-bottom:1px solid #2a2a2a;cursor:move;}
.grid-mini{display:grid;grid-template-columns:1fr 1px 1fr;padding:10px 8px 8px;}
.vline{background:#2a2a2a;align-self:stretch;margin:4px 0;}
.ring-item-mini{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 6px;}
.ring-wrap-mini{position:relative;width:52px;height:52px;cursor:default;}
.ring-wrap-mini svg{width:52px;height:52px;display:block;}
.rpct-mini{font-size:12px;font-weight:700;color:#f0f0f0;}
.mlabel{font-size:9px;color:#888;text-align:center;line-height:1.3;}
.mreset{font-size:8px;color:#666;text-align:center;line-height:1.5;}
.footer-mini{display:flex;justify-content:center;align-items:center;padding:5px 10px 8px;border-top:1px solid #2a2a2a;}
</style>
</head>
<body>

<!-- ── 일반 모드 ── -->
<div id="uiFull">
  <div class="tb-full" id="titlebar">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:8px;height:8px;border-radius:50%;background:#d97706;flex-shrink:0;"></div>
      <span style="font-size:12px;font-weight:600;color:#ccc;letter-spacing:.02em;">Claude 사용량</span>
      <span style="font-size:10px;color:#555;" id="planLabel"></span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button class="iBtn" id="btnRefreshFull" title="새로고침">↻</button>
      <button class="iBtn" id="btnToggle" title="미니 모드">⊟</button>
      <div style="display:flex;gap:5px;margin-left:4px;">
        <button class="wb mn" style="width:12px;height:12px;" id="btnMin">–</button>
        <button class="wb cl" style="width:12px;height:12px;" id="btnClose">✕</button>
      </div>
    </div>
  </div>
  <div id="fullContent">
    <div class="body-full">
      <div class="state-box" style="padding:28px 14px;font-size:12px;">
        <div class="spinner" style="width:16px;height:16px;margin-bottom:8px;"></div><br>불러오는 중...
      </div>
    </div>
  </div>
  <div class="footer-full">
    <span style="font-size:10px;color:#444;" id="updFull">—</span>
  </div>
</div>

<!-- ── 미니 모드 ── -->
<div id="uiMini">
  <div class="tb-mini" id="titlebarMini">
    <div style="display:flex;align-items:center;gap:5px;">
      <div style="width:6px;height:6px;border-radius:50%;background:#d97706;flex-shrink:0;"></div>
      <span style="font-size:10px;font-weight:600;color:#aaa;">Claude</span>
    </div>
    <div style="display:flex;align-items:center;gap:3px;">
      <button class="iBtn" id="btnRefreshMini" style="font-size:13px;">↻</button>
      <button class="iBtn" id="btnExpand" title="확대">⊞</button>
    </div>
  </div>
  <div id="miniContent">
    <div class="grid-mini">
      <div class="state-box" style="padding:16px 8px;font-size:10px;grid-column:1/-1;">
        <div class="spinner" style="width:12px;height:12px;margin-bottom:6px;"></div>
      </div>
    </div>
  </div>
  <div class="footer-mini">
    <span style="font-size:9px;color:#444;" id="updMini">—</span>
  </div>
</div>

<script>
const {ipcRenderer} = require('electron');

let isMini = false, cache = null, timerInterval = null;
let snapX = 'right', snapY = 'top';
let retryCount = 0, retryTimeout = null, countInterval = null;
const RETRY_DELAYS = [30, 60, 120, 300];

function initDrag(el) {
  let drag = false, sx, sy;
  el.addEventListener('mousedown', e => { drag = true; sx = e.screenX; sy = e.screenY; });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    ipcRenderer.send('move-window', { dx: e.screenX - sx, dy: e.screenY - sy });
    sx = e.screenX; sy = e.screenY;
  });
  document.addEventListener('mouseup', async () => {
    if (!drag) return;
    drag = false;
    const corner = await ipcRenderer.invoke('snap-to-edge');
    snapX = corner.snapX;
    snapY = corner.snapY;
  });
}
initDrag(document.getElementById('titlebar'));
initDrag(document.getElementById('titlebarMini'));

document.getElementById('btnClose').addEventListener('click', () => ipcRenderer.send('close-window'));
document.getElementById('btnMin').addEventListener('click', () => ipcRenderer.send('minimize-window'));
document.getElementById('btnToggle').addEventListener('click', () => switchMode(true));
document.getElementById('btnExpand').addEventListener('click', () => switchMode(false));
document.getElementById('btnRefreshFull').addEventListener('click', () => { resetRetry(); loadData(true); });
document.getElementById('btnRefreshMini').addEventListener('click', () => { resetRetry(); loadData(true); });
ipcRenderer.on('login-done', () => loadData(true));

function switchMode(mini) {
  isMini = mini;
  document.getElementById('uiFull').style.display = mini ? 'none' : 'block';
  document.getElementById('uiMini').style.display = mini ? 'block' : 'none';
  ipcRenderer.send('set-size', mini ? { w: 160, snapX, snapY } : { w: 580, snapX, snapY });
  if (cache) mini ? renderMini(cache) : renderFull(cache);
  else resizeToContent();
}

function ringColor(p) { return p >= 80 ? '#ef4444' : p >= 50 ? '#f59e0b' : '#22c55e'; }

function makeRingFull(p) {
  const r = 30, c = 38, ci = 2 * Math.PI * r, off = ci * (1 - p / 100), col = ringColor(p);
  return `<svg viewBox="0 0 76 76"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="7"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${ci.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/></svg>`;
}

function makeRingMini(p) {
  const r = 21, c = 26, ci = 2 * Math.PI * r, off = ci * (1 - p / 100), col = ringColor(p);
  return `<svg viewBox="0 0 52 52"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="5"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${ci.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/></svg>`;
}

function cardBorder(p) {
  if (p >= 80) return 'rgba(239,68,68,0.45)';
  if (p >= 50) return 'rgba(245,158,11,0.38)';
  return '#2e2e2e';
}
function cardBg(p) {
  if (p >= 80) return 'rgba(239,68,68,0.07)';
  if (p >= 50) return 'rgba(245,158,11,0.06)';
  return '#252525';
}

function renderFull(data) {
  if (data.plan) document.getElementById('planLabel').textContent = data.plan;
  const s  = data.session       || { pct: 0, reset: '' };
  const wa = data.weekly_all    || { pct: 0, reset: '' };
  const wm = data.weekly_model  || null;
  const ex = data.extra         || { pct: 0, reset: '' };

  const card = (lbl, pct, resetTxt, extraTxt) => {
    const tip = (resetTxt || '').replace(/"/g, '&quot;');
    return `<div class="card-full" style="border-color:${cardBorder(pct)};background:${cardBg(pct)};">
      <div class="clabel">${lbl}</div>
      <div class="ring-wrap-full tip" data-tip="${tip || '재설정 정보 없음'}">
        ${makeRingFull(pct)}<div class="ring-center"><span class="rpct-full">${pct}%</span></div>
      </div>
      <div class="rtxt"><div class="rval">${resetTxt || '—'}</div>${extraTxt ? `<div>${extraTxt}</div>` : ''}</div>
    </div>`;
  };

  document.getElementById('fullContent').innerHTML =
    `<div class="body-full">
      ${card('현재 세션', s.pct, s.reset, '')}
      <div class="divv"></div>
      ${card('주간 · 전체', wa.pct, wa.reset, '')}
      ${wm ? `<div class="divv"></div>${card(wm.label ? `주간 · ${wm.label}` : '주간 · 모델', wm.pct, wm.reset, '')}` : ''}
      <div class="divv"></div>
      ${card('사용 크레딧', ex.pct, ex.reset, data.extra_balance ? `잔액 ${data.extra_balance}` : (data.extra_used || ''))}
    </div>`;
  resizeToContent();
}

function renderMini(data) {
  const s  = data.session    || { pct: 0, reset: '' };
  const wa = data.weekly_all || { pct: 0, reset: '' };
  const item = (pct, label, reset) => {
    const tip = (reset || '').replace(/"/g, '&quot;');
    return `<div class="ring-item-mini">
      <div class="ring-wrap-mini tip" data-tip="${tip || '재설정 정보 없음'}">
        ${makeRingMini(pct)}<div class="ring-center"><span class="rpct-mini">${pct}%</span></div>
      </div>
      <div class="mlabel">${label}</div><div class="mreset">${reset || ''}</div>
    </div>`;
  };
  document.getElementById('miniContent').innerHTML =
    `<div class="grid-mini">
      ${item(s.pct, '현재 세션', s.reset)}
      <div class="vline"></div>
      ${item(wa.pct, '주간 · 전체', wa.reset)}
    </div>`;
  resizeToContent();
}

function renderError(data) {
  const isAuth = data?.error === 'auth' || data?.error === 'no_cookie';
  document.getElementById('fullContent').innerHTML =
    `<div class="body-full"><div class="state-box" style="padding:28px 14px;font-size:12px;">
      ${isAuth ? '🔐 로그인이 필요합니다' : '⚠️ 데이터를 불러오지 못했습니다'}
      <div style="color:#ef4444;font-size:11px;margin-top:4px;">${data?.message || ''}</div>
      ${isAuth ? '<button class="login-btn" onclick="openLogin()">로그인하기</button>' : ''}
    </div></div>`;
  document.getElementById('miniContent').innerHTML =
    `<div class="grid-mini"><div class="state-box" style="padding:16px 8px;font-size:10px;grid-column:1/-1;color:#666;">연결 필요</div></div>`;
  resizeToContent();
}

function fmtElapsed(ts) {
  const d = Math.round((Date.now() - ts) / 1000);
  if (d < 5)  return '방금 전';
  if (d < 60) return `${d}초 전`;
  return `${Math.round(d / 60)}분 전`;
}

function resizeToContent() {
  requestAnimationFrame(() => {
    const el = document.getElementById(isMini ? 'uiMini' : 'uiFull');
    ipcRenderer.send('resize-height', { h: el.offsetHeight, snapX, snapY });
  });
}

function setFooter(txt) {
  document.getElementById('updFull').textContent = txt;
  document.getElementById('updMini').textContent = txt;
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function resetRetry() {
  retryCount = 0;
  if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }
  if (countInterval) { clearInterval(countInterval); countInterval = null; }
}

function scheduleRetry() {
  if (retryTimeout) clearTimeout(retryTimeout);
  if (countInterval) { clearInterval(countInterval); countInterval = null; }
  stopTimer();
  const delay = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];
  retryCount++;
  let remaining = delay;
  setFooter(`${remaining}초 후 재시도`);
  countInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) setFooter(`${remaining}초 후 재시도`);
    else { clearInterval(countInterval); countInterval = null; }
  }, 1000);
  retryTimeout = setTimeout(() => {
    if (countInterval) { clearInterval(countInterval); countInterval = null; }
    loadData(true);
  }, delay * 1000);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!cache?.fetched_at) return;
    const txt = fmtElapsed(cache.fetched_at);
    document.getElementById('updFull').textContent = txt;
    document.getElementById('updMini').textContent = txt;
  }, 1000);
}

function setLoading(on) {
  const bf = document.getElementById('btnRefreshFull');
  const bm = document.getElementById('btnRefreshMini');
  bf.disabled = on; bf.textContent = on ? '…' : '↻';
  bm.disabled = on; bm.textContent = on ? '…' : '↻';
}

function parseHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const result = {};
  const bars   = Array.from(doc.querySelectorAll('[role="meter"]'));

  function getCard(bar) {
    let card = bar.parentElement;
    while (card) {
      const parent = card.parentElement;
      if (!parent || parent.querySelectorAll('[role="meter"]').length > 1) break;
      card = parent;
    }
    return card;
  }

  function getResetText(bar) {
    const card = getCard(bar);
    if (!card) return '';
    for (const el of card.querySelectorAll('p, span')) {
      const t = el.textContent.trim();
      if (t && (t.includes('재설정') || t.toLowerCase().includes('reset') || t.includes('아직'))) {
        return t;
      }
    }
    return '';
  }

  const entries = bars.map(bar => {
    const card = getCard(bar);
    return {
      bar, card,
      text: card ? card.textContent : '',
      pct: parseInt(bar.getAttribute('aria-valuenow')) || 0,
      reset: getResetText(bar),
    };
  });

  console.group('[parseHTML] meters found:', entries.length);
  entries.slice(0, 7).forEach((e, i) => {
    const texts = e.card
      ? Array.from(e.card.querySelectorAll('p, span'))
          .map(el => el.textContent.trim()).filter(t => t && t.length < 120)
      : [];
    console.log(`meter[${i}] pct=${e.pct} reset="${e.reset}" | all texts:`, texts);
  });
  console.groupEnd();

  const byLabel = (...labels) =>
    entries.find(e => labels.some(l => e.text.toLowerCase().includes(l.toLowerCase())));

  const sessionE = byLabel('현재 세션', 'Current session') || entries[0];
  const allE     = byLabel('모든 모델', 'All models')      || entries[1];
  const extraE   = byLabel('사용 크레딧', 'usage credit')  ||
                   (entries.length >= 4 ? entries[entries.length - 1] : null);
  const modelE   = entries.find(e => e !== sessionE && e !== allE && e !== extraE) || null;

  const toUsage = e => e ? { pct: e.pct, reset: e.reset } : null;
  if (sessionE) result.session    = toUsage(sessionE);
  if (allE)     result.weekly_all = toUsage(allE);
  if (extraE)   result.extra      = toUsage(extraE);
  if (modelE) {
    let label = '';
    for (const el of modelE.card?.querySelectorAll('p, span, div, h1, h2, h3') || []) {
      const t = el.textContent.trim();
      if (t && t.length < 40 && !t.includes('%') && !t.includes('재설정') &&
          !t.includes('사용됨') && !t.includes('US$') && !t.includes('아직')) { label = t; break; }
    }
    result.weekly_model = { pct: modelE.pct, reset: modelE.reset, label };
  }

  for (const el of doc.querySelectorAll('p, span, div')) {
    const t = el.textContent.trim();
    const m = t.match(/US\$[\d.]+\s*사용/);
    if (m && t.length < 60) { result.extra_used = m[0]; break; }
  }
  for (const el of doc.querySelectorAll('p, span, div')) {
    const t = el.textContent;
    if (!t.includes('현재 잔액') || t.length > 120) continue;
    let scope = el, hops = 0;
    while (scope && hops < 4) {
      const amounts = scope.textContent.match(/US\$[\d.]+(?:\s*사용)?/g) || [];
      const bal = amounts.find(a => !a.includes('사용'));
      if (bal) { result.extra_balance = bal; break; }
      scope = scope.parentElement; hops++;
    }
    break;
  }

  let plan = '';
  for (const el of doc.querySelectorAll('div[class*="items-start"][class*="justify-between"] *')) {
    const t = el.textContent.trim();
    if (/^Max \(\d+x\)$/.test(t)) { plan = t; break; }
  }
  if (!plan) {
    for (const el of doc.querySelectorAll('p, span, div')) {
      const t = el.textContent.trim();
      const m = t.length < 60 && t.match(/Max \(\d+x\)/);
      if (m) { plan = m[0]; break; }
    }
  }
  if (plan) result.plan = plan;
  result.fetched_at = Date.now();
  return result;
}

async function loadData(force = false) {
  setLoading(true);
  if (!force && cache && (Date.now() - cache.fetched_at) < 5 * 60 * 1000) {
    isMini ? renderMini(cache) : renderFull(cache);
    setLoading(false);
    return;
  }
  const res = await ipcRenderer.invoke('fetch-usage');
  setLoading(false);
  if (res.html) {
    cache = parseHTML(res.html);
    isMini ? renderMini(cache) : renderFull(cache);
    resetRetry();
    startTimer();
  } else {
    renderError(res);
    if (res.error !== 'auth') scheduleRetry();
  }
}

function openLogin() { ipcRenderer.send('open-login'); }

loadData(true);
setInterval(() => loadData(false), 5 * 60 * 1000);
</script>
</body>
</html>
