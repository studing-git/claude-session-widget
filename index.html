<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow:hidden;background:#1a1a1a;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none;border-radius:14px;border:1px solid #2e2e2e;}

/* 트래픽라이트 */
.wb{border-radius:50%;border:none;cursor:pointer;color:transparent;font-size:0;}
.wb.mn{background:#f5a623;}
.wb.cl{background:#ff5f57;}

/* 아이콘 버튼 */
.iBtn{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;transition:color .15s,background .15s;line-height:1;}
.iBtn:hover{color:#ccc;background:#2a2a2a;}
.iBtn:disabled{opacity:.35;cursor:not-allowed;}

/* 툴팁 */
.tip{position:relative;}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#2c2c2c;color:#ccc;font-size:10px;padding:4px 9px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid #3a3a3a;z-index:99;}
.tip:hover::after{opacity:1;}

/* 업데이트 배지 */
/* 업데이트 버튼은 항상 보인다. 평소엔 아이콘만(= 업데이트 확인),
   새 버전이 감지되면 주황 알약(= 지금 적용)으로 바뀐다. */
.upd{display:inline-flex;align-items:center;gap:4px;background:none;color:#555;border:none;border-radius:5px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:2px 5px;line-height:1;transition:color .15s,background .15s;}
.upd:hover{color:#ccc;background:#2a2a2a;}
.upd:disabled{opacity:.4;cursor:progress;}
.upd.show{background:#d97706;color:#fff;font-size:9px;padding:3px 7px;}
.upd.show:hover{background:#b45309;}
.upd-mini{font-size:12px;}
.upd-mini.show{font-size:8px;padding:2px 5px;}

@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;border:2px solid #2e2e2e;border-top-color:#d97706;border-radius:50%;animation:spin .7s linear infinite;}
.state-box{text-align:center;color:#666;line-height:1.7;width:100%;}
.login-btn{display:inline-block;margin-top:10px;padding:6px 16px;background:#d97706;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;}

/* ── 일반 모드 580px ── */
#uiFull{width:580px;display:none;}
.tb-full{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 9px;border-bottom:1px solid #2a2a2a;cursor:move;}
.body-full{display:flex;padding:16px 14px;gap:6px;}
.card-full{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 1px 12px;background:#252525;border-radius:10px;border:1px solid #2e2e2e;transition:border-color .3s,background .3s;}
.clabel{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:600;}
.ring-wrap-full{position:relative;width:76px;height:76px;cursor:default;}
.ring-wrap-full svg{width:76px;height:76px;display:block;}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.rpct-full{font-size:16px;font-weight:700;color:#f0f0f0;}
.rtxt{font-size:9px;color:#888;text-align:center;line-height:1.6;}
.rval{font-size:10px;color:#aaa;font-weight:500;}
.divv{width:1px;background:#2a2a2a;align-self:stretch;flex-shrink:0;}
.footer-full{display:flex;justify-content:flex-start;align-items:center;padding:8px 16px 12px;border-top:1px solid #2a2a2a;}

/* ── 미니 모드 160px ── */
#uiMini{width:144px;display:none;}
.tb-mini{display:flex;justify-content:space-between;align-items:center;padding:6px 9px 5px;border-bottom:1px solid #2a2a2a;cursor:move;}
.grid-mini{display:grid;grid-template-columns:1fr 1px 1fr;padding:8px 6px 7px;}
.vline{background:#2a2a2a;align-self:stretch;margin:4px 0;}
.ring-item-mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 4px;}
.ring-wrap-mini{position:relative;width:52px;height:52px;cursor:default;}
.ring-wrap-mini svg{width:52px;height:52px;display:block;}
.rpct-mini{font-size:12px;font-weight:700;color:#f0f0f0;}
.mlabel{font-size:9px;color:#888;text-align:center;line-height:1.3;}
.footer-mini{display:flex;justify-content:center;align-items:center;padding:4px 10px 6px;border-top:1px solid #2a2a2a;}
.mini-rows{padding:6px 8px 6px;}
.mrow{display:flex;align-items:center;gap:5px;padding:4px 2px;cursor:default;}
.mname{font-size:9px;color:#aaa;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mcell{font-size:10px;font-weight:700;width:30px;text-align:right;flex-shrink:0;}

/* 미니 모드는 창이 좁아 기본 툴팁이 창 밖으로 잘린다.
   재설정 정보를 볼 수 있는 유일한 수단이므로 창 폭에 맞춰 고정 배치한다. */
#uiMini .tip::after{position:fixed;left:5px;right:5px;top:30px;bottom:auto;transform:none;
  white-space:normal;text-align:center;line-height:1.4;z-index:100;}

/* ── 통합 모드 360px (Claude · ChatGPT · Gemini) ── */
#uiUni{width:360px;display:block;}
.tb-uni{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 9px;border-bottom:1px solid #2a2a2a;cursor:move;}
.rows-uni{padding:6px 12px 8px;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #232323;overflow:hidden;}
.prow:last-child{border-bottom:none;}
.pwho{width:80px;flex-shrink:0;}
.pname{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#ddd;}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pplan{font-size:8.5px;color:#6a6a6a;margin-top:3px;margin-left:14px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmetrics{flex:1;display:flex;gap:10px;min-width:0;}
.pm{flex:1;min-width:0;}
.pmh{display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:5px;}
.pml{font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmv{font-size:12px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
.ptrack{height:4px;border-radius:3px;background:#2b2b2b;overflow:hidden;}
.pfill{height:100%;border-radius:3px;}
.psub{font-size:8px;color:#5f5f5f;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pstate{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:9.5px;color:#6a6a6a;}
.pbtn{background:#2a2a2a;border:1px solid #383838;color:#bbb;border-radius:5px;cursor:pointer;
  font-family:inherit;font-size:9px;padding:3px 8px;line-height:1.4;flex-shrink:0;white-space:nowrap;}
.pbtn:hover{background:#333;color:#eee;}
.pswap{background:none;border:none;color:#4a4a4a;cursor:pointer;font-family:inherit;font-size:8.5px;
  padding:2px 4px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s,background .15s;flex-shrink:0;}
.prow:hover .pswap{opacity:1;}
.pswap:hover{color:#ccc;background:#2a2a2a;}
.pbtn-chrome{border-color:#3d5a3d;color:#9c9;}
.pchrome{display:block;margin-top:3px;margin-left:14px;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:8px;color:#4a7a5a;padding:0;text-decoration:underline;
  text-underline-offset:2px;}
.pchrome:hover{color:#7cc;}
.psrc{flex-shrink:0;align-self:flex-start;font-size:8px;color:#5a7a5a;border:1px solid #34503a;
  border-radius:4px;padding:1px 4px;margin-top:2px;}
.pbtn-chrome:hover{background:#2c3a2c;color:#dfd;}
.footer-uni{display:flex;justify-content:space-between;align-items:center;padding:7px 14px 10px;border-top:1px solid #2a2a2a;}
.fnote{font-size:9.5px;color:#3a3a3a;}
</style>
</head>
<body>

<!-- ── 통합 모드 (기본) ── -->
<div id="uiUni">
  <div class="tb-uni" id="titlebarUni">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:8px;height:8px;border-radius:50%;background:#d97706;flex-shrink:0;"></div>
      <span style="font-size:12px;font-weight:600;color:#ccc;letter-spacing:.02em;">AI 사용량</span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button class="upd" id="btnUpdateUni">⬆</button>
      <button class="iBtn" id="btnRefreshUni" title="새로고침">↻</button>
      <button class="iBtn" id="btnModeUni" title="Claude 상세">⊞</button>
      <div style="display:flex;gap:5px;margin-left:4px;">
        <button class="wb mn" style="width:12px;height:12px;" id="btnMinUni">–</button>
        <button class="wb cl" style="width:12px;height:12px;" id="btnCloseUni">✕</button>
      </div>
    </div>
  </div>
  <div id="uniContent">
    <div class="rows-uni">
      <div class="state-box" style="padding:28px 14px;font-size:12px;">
        <div class="spinner" style="width:16px;height:16px;margin-bottom:8px;"></div><br>불러오는 중...
      </div>
    </div>
  </div>
  <div class="footer-uni">
    <span style="font-size:10px;color:#444;" id="updUni">—</span>
    <span class="fnote" id="connUni"></span>
  </div>
</div>

<!-- ── 일반 모드 ── -->
<div id="uiFull">
  <div class="tb-full" id="titlebar">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:8px;height:8px;border-radius:50%;background:#d97706;flex-shrink:0;"></div>
      <span style="font-size:12px;font-weight:600;color:#ccc;letter-spacing:.02em;">Claude 사용량</span>
      <span style="font-size:10px;color:#555;" id="planLabel"></span>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button class="upd" id="btnUpdateFull">⬆</button>
      <button class="iBtn" id="btnRefreshFull" title="새로고침">↻</button>
      <button class="iBtn" id="btnToggle" title="미니 모드">⊟</button>
      <div style="display:flex;gap:5px;margin-left:4px;">
        <button class="wb mn" style="width:12px;height:12px;" id="btnMin">–</button>
        <button class="wb cl" style="width:12px;height:12px;" id="btnClose">✕</button>
      </div>
    </div>
  </div>
  <div id="fullContent">
    <div class="body-full">
      <div class="state-box" style="padding:28px 14px;font-size:12px;">
        <div class="spinner" style="width:16px;height:16px;margin-bottom:8px;"></div><br>불러오는 중...
      </div>
    </div>
  </div>
  <div class="footer-full">
    <span style="font-size:10px;color:#444;" id="updFull">—</span>
  </div>
</div>

<!-- ── 미니 모드 ── -->
<div id="uiMini">
  <div class="tb-mini" id="titlebarMini">
    <div style="display:flex;align-items:center;gap:5px;">
      <div style="width:6px;height:6px;border-radius:50%;background:#d97706;flex-shrink:0;"></div>
      <span style="font-size:10px;font-weight:600;color:#aaa;">AI 사용량</span>
    </div>
    <div style="display:flex;align-items:center;gap:3px;">
      <button class="upd upd-mini" id="btnUpdateMini">⬆</button>
      <button class="iBtn" id="btnRefreshMini" style="font-size:13px;">↻</button>
      <button class="iBtn" id="btnExpand" title="확대">⊞</button>
    </div>
  </div>
  <div id="miniContent">
    <div class="grid-mini">
      <div class="state-box" style="padding:16px 8px;font-size:10px;grid-column:1/-1;">
        <div class="spinner" style="width:12px;height:12px;margin-bottom:6px;"></div>
      </div>
    </div>
  </div>
  <div class="footer-mini">
    <span style="font-size:9px;color:#444;" id="updMini">—</span>
  </div>
</div>

<script>
const {ipcRenderer} = require('electron');
const providers = require('./providers');

// 'uni'(통합·기본) → 'full'(Claude 상세) → 'mini' 순환
const MODES = ['uni', 'full', 'mini'];
let mode = 'uni', cache = null, timerInterval = null, updating = false;
let extInfo = { connected: [] };
const viaExtension = id => (extInfo.connected || []).includes(id) ||
  ((cache && cache.providers || []).some(p => p.id === id && p.fromExtension));
let snapX = 'right', snapY = 'top';
let retryCount = 0, retryTimeout = null, countInterval = null;
const RETRY_DELAYS = [30, 60, 120, 300];
// CSS의 #uiUni / #uiFull / #uiMini 너비와 반드시 일치해야 한다
const WIDTHS = { uni: 360, full: 580, mini: 144 };
const VIEWS  = { uni: 'uiUni', full: 'uiFull', mini: 'uiMini' };

function initDrag(el) {
  let drag = false, sx, sy;
  el.addEventListener('mousedown', e => { drag = true; sx = e.screenX; sy = e.screenY; });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    ipcRenderer.send('move-window', { dx: e.screenX - sx, dy: e.screenY - sy });
    sx = e.screenX; sy = e.screenY;
  });
  document.addEventListener('mouseup', async () => {
    if (!drag) return;
    drag = false;
    const corner = await ipcRenderer.invoke('snap-to-edge');
    snapX = corner.snapX;
    snapY = corner.snapY;
  });
}
initDrag(document.getElementById('titlebarUni'));
initDrag(document.getElementById('titlebar'));
initDrag(document.getElementById('titlebarMini'));

['btnClose', 'btnCloseUni'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => ipcRenderer.send('close-window')));
['btnMin', 'btnMinUni'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => ipcRenderer.send('minimize-window')));
['btnRefreshUni', 'btnRefreshFull', 'btnRefreshMini'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => { resetRetry(); loadData(true); }));
// 모드 전환 버튼은 모두 다음 모드로 순환시킨다
['btnModeUni', 'btnToggle', 'btnExpand'].forEach(id =>
  document.getElementById(id).addEventListener('click', nextMode));

/* ── 자동 업데이트 ── */
const updBtns = [document.getElementById('btnUpdateUni'),
                 document.getElementById('btnUpdateFull'),
                 document.getElementById('btnUpdateMini')];
const btnUpdFull = document.getElementById('btnUpdateFull');
const btnUpdUni  = document.getElementById('btnUpdateUni');

// 현재 버전을 툴팁에 보여 주면 "지금 몇 버전이지?" 를 위젯에서 바로 알 수 있다
const APP_VERSION = (() => {
  try { return require('./package.json').version; } catch (e) { return ''; }
})();
const IDLE_TIP = `업데이트 확인${APP_VERSION ? ` (현재 v${APP_VERSION})` : ''}\n` +
                 '클릭하면 새 버전을 확인하고, 있으면 바로 받아 재시작합니다';

// 새 버전이 감지된 상태인가 — 버튼이 '확인'인지 '적용'인지를 가른다
let updateReady = false;

function setUpdLabels() {
  const wide = updateReady ? '⬆ 업데이트' : '⬆';
  btnUpdFull.textContent = wide;
  btnUpdUni.textContent  = wide;
}

function showUpdateBadge(info) {
  updateReady = true;
  const tip = `새 버전 ${info.behind}개 커밋${info.subject ? ` · ${info.subject}` : ''}\n클릭하면 업데이트 후 재시작합니다`;
  updBtns.forEach(b => { b.classList.add('show'); b.title = tip; });
  setUpdLabels();
  resizeToContent();
}

function clearUpdateBadge() {
  updateReady = false;
  updBtns.forEach(b => { b.classList.remove('show'); b.title = IDLE_TIP; });
  setUpdLabels();
  resizeToContent();
}

function endUpdateState(msg) {
  updBtns.forEach(b => { b.disabled = false; b.title = updateReady ? b.title : IDLE_TIP; });
  setUpdLabels();
  setFooter(msg);
  // 메시지를 잠시 보여준 뒤 평소 동작(경과 시간 표시·데이터 갱신)을 재개한다
  setTimeout(() => {
    updating = false;
    startTimer();
    if (!cache) loadData(true);
  }, 5000);
}

async function applyUpdate() {
  if (updating) return;
  updating = true;
  updBtns.forEach(b => { b.disabled = true; });
  btnUpdFull.textContent = '⬆ 업데이트 중…';
  btnUpdUni.textContent  = '⬆ 업데이트 중…';
  // 경과 시간 타이머와 재시도 카운트다운이 상태 메시지를 덮어쓰지 않도록 멈춘다
  stopTimer();
  resetRetry();
  setFooter('업데이트 중…');
  const res = await ipcRenderer.invoke('apply-update');
  if (res.ok) {
    if (res.restart) {
      setFooter('재시작 중…'); // 곧 앱이 재시작되므로 타이머를 되살리지 않는다
      return;
    }
    clearUpdateBadge();
    endUpdateState('이미 최신 버전입니다');
    return;
  }
  const raw = (res.message || '').split('\n')[0].slice(0, 60);
  endUpdateState(
    res.reason === 'dirty'   ? '로컬 변경사항이 있어 업데이트를 건너뜁니다' :
    res.reason === 'not_git' ? 'git 저장소가 아니라 업데이트할 수 없습니다' :
    `업데이트 실패: ${raw}`
  );
}

// 버튼 한 번으로 "확인 → 있으면 바로 git pull 후 재시작" 까지 끝낸다.
// (새 버전이 이미 감지된 상태면 곧장 적용한다)
async function onUpdateClick() {
  if (updating) return;
  if (updateReady) { applyUpdate(); return; }

  updating = true;                       // 확인 중 중복 클릭 방지
  updBtns.forEach(b => { b.disabled = true; });
  stopTimer();                           // 경과 시간 표시가 상태 메시지를 덮지 않도록
  resetRetry();
  setFooter('업데이트 확인 중…');

  let res = null;
  try { res = await ipcRenderer.invoke('check-update'); } catch (e) {}

  if (res && res.available) {
    showUpdateBadge(res);
    updating = false;                    // applyUpdate 가 다시 잠근다
    applyUpdate();                       // 확인되면 곧바로 적용
    return;
  }
  // endUpdateState 가 버튼을 되살리고 5초 뒤 평소 표시로 돌아간다
  endUpdateState(res && res.reason === 'not_git'
    ? 'git 저장소가 아니라 업데이트할 수 없습니다'
    : '이미 최신 버전입니다');
}

updBtns.forEach(b => { b.title = IDLE_TIP; b.addEventListener('click', onUpdateClick); });
ipcRenderer.on('update-available', (e, info) => showUpdateBadge(info));
// 시작 시 1회 확인 (리스너 등록이 끝난 뒤이므로 이벤트 유실 없음)
ipcRenderer.invoke('check-update').then(res => { if (res && res.available) showUpdateBadge(res); });
ipcRenderer.invoke('extension-status').then(info => { if (info) extInfo = info; }).catch(() => {});
let extRefreshTimer = null;
ipcRenderer.on('extension-report', () => {
  // 여러 보고가 몰려와도 한 번만 갱신한다
  if (extRefreshTimer) return;
  extRefreshTimer = setTimeout(() => { extRefreshTimer = null; loadData(true); }, 800);
});
// 확장이 쿠키를 넘겨 위젯 세션에 주입되면, 그 쿠키로 곧바로 다시 조회한다
ipcRenderer.on('cookies-updated', () => {
  if (extRefreshTimer) return;
  extRefreshTimer = setTimeout(() => { extRefreshTimer = null; loadData(true); }, 800);
});
ipcRenderer.invoke('session-report')
  .then(rows => { if (rows) { console.log('[진단] 제공자별 쿠키 상태'); console.table(rows); } })
  .catch(() => {});

function setMode(next) {
  mode = MODES.includes(next) ? next : 'uni';
  for (const m of MODES) {
    document.getElementById(VIEWS[m]).style.display = (m === mode) ? 'block' : 'none';
  }
  ipcRenderer.send('set-size', { w: WIDTHS[mode], snapX, snapY });
  if (cache) render(cache); else resizeToContent();
}

function nextMode() {
  setMode(MODES[(MODES.indexOf(mode) + 1) % MODES.length]);
}

// 현재 모드에 맞는 화면을 그린다
function render(data) {
  if (mode === 'uni')  renderUnified(data);
  else if (mode === 'full') renderFull(data);
  else renderMini(data);
}

function ringColor(p) { return p >= 80 ? '#ef4444' : p >= 50 ? '#f59e0b' : '#22c55e'; }

function makeRingFull(p) {
  const r = 30, c = 38, ci = 2 * Math.PI * r, off = ci * (1 - p / 100), col = ringColor(p);
  return `<svg viewBox="0 0 76 76"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="7"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${ci.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/></svg>`;
}

function makeRingMini(p) {
  const r = 21, c = 26, ci = 2 * Math.PI * r, off = ci * (1 - p / 100), col = ringColor(p);
  return `<svg viewBox="0 0 52 52"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="5"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${ci.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})"/></svg>`;
}

function cardBorder(p) {
  if (p >= 80) return 'rgba(239,68,68,0.45)';
  if (p >= 50) return 'rgba(245,158,11,0.38)';
  return '#2e2e2e';
}
function cardBg(p) {
  if (p >= 80) return 'rgba(239,68,68,0.07)';
  if (p >= 50) return 'rgba(245,158,11,0.06)';
  return '#252525';
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// 재설정 문장을 좁은 칸에 맞게 줄인다 ("7일 0시간 후 초기화" → "7일 0시간 후")
function shortReset(t) {
  if (!t) return '';
  return t.replace(/에?\s*(재설정됨|재설정|초기화)$/, '').replace(/^\(|\)$/g, '').trim();
}

const byId = (data, id) => (data.providers || []).find(p => p.id === id) || null;

/* ── 통합 모드 ── */
function renderUnified(data) {
  const list = data.providers || [];

  const metricHtml = (m) => {
    // 크레딧처럼 한도가 아닌 값은 게이지를 채우지 않고 값만 보여준다
    const showGauge = m.gauge !== false;
    const pct = Math.max(0, Math.min(100, m.pct || 0));
    const val = showGauge ? `${pct}%` : esc(m.value != null ? m.value : '—');
    const col = showGauge ? ringColor(pct) : '#999';
    const sub = shortReset(m.reset) || m.detail || '';
    return `<div class="pm">
      <div class="pmh"><span class="pml">${esc(m.label)}</span><span class="pmv" style="color:${col}">${val}</span></div>
      <div class="ptrack"><div class="pfill" style="width:${showGauge ? pct : 0}%;background:${col}"></div></div>
      <div class="psub" title="${esc(m.reset || m.detail || '')}">${esc(sub)}</div>
    </div>`;
  };

  const rowHtml = (p) => {
    let body;
    if (p.state === 'ok') {
      const src = p.fromExtension
        ? `<span class="psrc" title="브라우저 확장 프로그램에서 받은 값입니다">확장</span>` : '';
      body = `<div class="pmetrics">${p.metrics.slice(0, 2).map(metricHtml).join('')}</div>${src}`;
    } else {
      // auth 가 아닌 error 도 대부분 로그인이 안 된 상태다. 로그아웃 상태의 SPA는
      // 로그인 URL로 리다이렉트하지 않고 빈 페이지만 그려 지표를 못 찾는 경우가 많다.
      // 어느 쪽이든 로그인할 방법은 항상 있어야 한다.
      const full = p.state === 'auth' ? '로그인이 필요합니다' : (p.message || '불러오지 못했습니다');
      // 버튼이 밀려나지 않도록 짧게 줄인다. 전체 문구는 title 로 볼 수 있다.
      const msg = p.state === 'auth' ? '연결 필요'
                : /찾지 못했/.test(full) ? '사용량 없음'
                : /시간 초과|timeout/i.test(full) ? '시간 초과'
                : full.length > 16 ? full.slice(0, 16) + '…' : full;
      const col = p.state === 'auth' ? '#6a6a6a' : '#a15c5c';
      // 평소 쓰는 실제 브라우저에서 사용량 페이지를 열어 확장 프로그램으로 연결한다
      body = `<div class="pstate" title="${esc(full)}">
        <span style="color:${col};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(msg)}</span>
        <button class="pbtn pbtn-ext" data-connect="${esc(p.id)}"
          title="평소 쓰는 브라우저에서 사용량 페이지를 엽니다. 확장 프로그램이 그 값을 위젯으로 보냅니다.">연결하기</button></div>`;
    }
    return `<div class="prow">
      <div class="pwho">
        <div class="pname"><div class="pdot" style="background:${esc(p.accent)}"></div>${esc(p.name)}</div>
        <div class="pplan" title="${esc(p.note || p.plan || '')}">${esc(p.plan || '—')}</div>
      </div>
      ${body}
      ${p.state === 'ok'
        ? `<button class="pswap" data-swap="${esc(p.id)}" title="${esc(p.name)} 계정 전환 — 평소 쓰는 브라우저에서 다른 계정으로 로그인합니다">전환</button>`
        : ''}
    </div>`;
  };

  document.getElementById('uniContent').innerHTML =
    `<div class="rows-uni">${list.map(rowHtml).join('')}</div>`;

  const ok = list.filter(p => p.state === 'ok').length;
  document.getElementById('connUni').textContent = list.length ? `${ok}/${list.length} 연결됨` : '';

  document.querySelectorAll('#uniContent [data-swap]').forEach(b =>
    b.addEventListener('click', () => switchAccount(b.getAttribute('data-swap'))));
  document.querySelectorAll('#uniContent [data-connect]').forEach(b =>
    b.addEventListener('click', () => connectProvider(b.getAttribute('data-connect'))));
  resizeToContent();
}

/* ── Claude 상세 모드 ── */
function renderFull(data) {
  const c = byId(data, 'claude');
  document.getElementById('planLabel').textContent = (c && c.plan) || '';

  if (!c || c.state !== 'ok') {
    const isAuth = c && c.state === 'auth';
    document.getElementById('fullContent').innerHTML =
      `<div class="body-full"><div class="state-box" style="padding:28px 14px;font-size:12px;">
        ${isAuth ? '🔗 Claude 연결이 필요합니다' : '⚠️ 데이터를 불러오지 못했습니다'}
        <div style="color:#ef4444;font-size:11px;margin-top:4px;">${esc(c ? c.message : '')}</div>
        ${isAuth ? '<button class="login-btn" data-connect="claude">연결하기</button>' : ''}
      </div></div>`;
    document.querySelectorAll('#fullContent [data-connect]').forEach(b =>
      b.addEventListener('click', () => connectProvider('claude')));
    resizeToContent();
    return;
  }

  const card = (lbl, pct, resetTxt, extraTxt) => {
    const tip = esc(resetTxt || '');
    return `<div class="card-full" style="border-color:${cardBorder(pct)};background:${cardBg(pct)};">
      <div class="clabel">${esc(lbl)}</div>
      <div class="ring-wrap-full tip" data-tip="${tip || '재설정 정보 없음'}">
        ${makeRingFull(pct)}<div class="ring-center"><span class="rpct-full">${pct}%</span></div>
      </div>
      <div class="rtxt"><div class="rval">${esc(resetTxt) || '—'}</div>${extraTxt ? `<div>${esc(extraTxt)}</div>` : ''}</div>
    </div>`;
  };

  const labelOf = m => ({ session: '현재 세션', weekly_all: '주간 · 전체', extra: '사용 크레딧' }[m.key]
                        || `주간 · ${m.label}`);
  document.getElementById('fullContent').innerHTML =
    `<div class="body-full">${
      c.metrics.map(m => card(labelOf(m), m.pct, m.reset, m.detail)).join('<div class="divv"></div>')
    }</div>`;
  resizeToContent();
}

/* ── 미니 모드: 3사 요약 ── */
function renderMini(data) {
  const list = data.providers || [];
  const row = (p) => {
    const cells = p.state === 'ok'
      ? p.metrics.slice(0, 2).map(m => {
          const showGauge = m.gauge !== false;
          const pct = Math.max(0, Math.min(100, m.pct || 0));
          return `<span class="mcell" style="color:${showGauge ? ringColor(pct) : '#888'}">${
            showGauge ? pct + '%' : esc(m.value != null ? m.value : '—')}</span>`;
        }).join('')
      : `<span class="mcell" style="color:#6a6a6a;flex:2">${p.state === 'auth' ? '로그인' : '오류'}</span>`;
    const tip = p.state === 'ok'
      ? p.metrics.slice(0, 2).map(m => `${m.label} ${m.gauge === false ? m.value : m.pct + '%'}${m.reset ? ' · ' + shortReset(m.reset) : ''}`).join('\n')
      : (p.message || '');
    return `<div class="mrow tip" data-tip="${esc(tip)}">
      <span class="pdot" style="background:${esc(p.accent)}"></span>
      <span class="mname">${esc(p.name)}</span>${cells}</div>`;
  };
  document.getElementById('miniContent').innerHTML =
    `<div class="mini-rows">${list.map(row).join('')}</div>`;
  resizeToContent();
}



function fmtElapsed(ts) {
  const d = Math.round((Date.now() - ts) / 1000);
  if (d < 5)  return '방금 전';
  if (d < 60) return `${d}초 전`;
  return `${Math.round(d / 60)}분 전`;
}

function resizeToContent() {
  requestAnimationFrame(() => {
    const el = document.getElementById(VIEWS[mode]);
    ipcRenderer.send('resize-height', { h: el.offsetHeight, snapX, snapY });
  });
}

const FOOTER_IDS = ['updUni', 'updFull', 'updMini'];
function setFooter(txt) {
  FOOTER_IDS.forEach(id => { document.getElementById(id).textContent = txt; });
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function resetRetry() {
  retryCount = 0;
  if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }
  if (countInterval) { clearInterval(countInterval); countInterval = null; }
}

function scheduleRetry() {
  if (retryTimeout) clearTimeout(retryTimeout);
  if (countInterval) { clearInterval(countInterval); countInterval = null; }
  stopTimer();
  const delay = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];
  retryCount++;
  let remaining = delay;
  setFooter(`${remaining}초 후 재시도`);
  countInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) setFooter(`${remaining}초 후 재시도`);
    else { clearInterval(countInterval); countInterval = null; }
  }, 1000);
  retryTimeout = setTimeout(() => {
    if (countInterval) { clearInterval(countInterval); countInterval = null; }
    loadData(true);
  }, delay * 1000);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!cache?.fetched_at) return;
    const txt = fmtElapsed(cache.fetched_at);
    FOOTER_IDS.forEach(id => { document.getElementById(id).textContent = txt; });
  }, 1000);
}

function setLoading(on) {
  ['btnRefreshUni', 'btnRefreshFull', 'btnRefreshMini'].forEach(id => {
    const b = document.getElementById(id);
    b.disabled = on; b.textContent = on ? '…' : '↻';
  });
}

function parseHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const result = {};
  const bars   = Array.from(doc.querySelectorAll('[role="meter"]'));

  function getCard(bar) {
    let card = bar.parentElement;
    while (card) {
      const parent = card.parentElement;
      if (!parent || parent.querySelectorAll('[role="meter"]').length > 1) break;
      card = parent;
    }
    return card;
  }

  function getResetText(bar) {
    const card = getCard(bar);
    if (!card) return '';
    for (const el of card.querySelectorAll('p, span')) {
      const t = el.textContent.trim();
      if (t && (t.includes('재설정') || t.toLowerCase().includes('reset') || t.includes('아직'))) {
        return t;
      }
    }
    return '';
  }

  const entries = bars.map(bar => {
    const card = getCard(bar);
    return {
      bar, card,
      text: card ? card.textContent : '',
      pct: parseInt(bar.getAttribute('aria-valuenow')) || 0,
      reset: getResetText(bar),
    };
  });

  console.group('[parseHTML] meters found:', entries.length);
  entries.slice(0, 7).forEach((e, i) => {
    const texts = e.card
      ? Array.from(e.card.querySelectorAll('p, span'))
          .map(el => el.textContent.trim()).filter(t => t && t.length < 120)
      : [];
    console.log(`meter[${i}] pct=${e.pct} reset="${e.reset}" | all texts:`, texts);
  });
  console.groupEnd();

  const byLabel = (...labels) =>
    entries.find(e => labels.some(l => e.text.toLowerCase().includes(l.toLowerCase())));

  const sessionE = byLabel('현재 세션', 'Current session') || entries[0];
  const allE     = byLabel('모든 모델', 'All models')      || entries[1];
  const extraE   = byLabel('사용 크레딧', 'usage credit')  ||
                   (entries.length >= 4 ? entries[entries.length - 1] : null);
  const modelE   = entries.find(e => e !== sessionE && e !== allE && e !== extraE) || null;

  const toUsage = e => e ? { pct: e.pct, reset: e.reset } : null;
  if (sessionE) result.session    = toUsage(sessionE);
  if (allE)     result.weekly_all = toUsage(allE);
  if (extraE)   result.extra      = toUsage(extraE);
  if (modelE) {
    let label = '';
    for (const el of modelE.card?.querySelectorAll('p, span, div, h1, h2, h3') || []) {
      const t = el.textContent.trim();
      if (t && t.length < 40 && !t.includes('%') && !t.includes('재설정') &&
          !t.includes('사용됨') && !t.includes('US$') && !t.includes('아직')) { label = t; break; }
    }
    result.weekly_model = { pct: modelE.pct, reset: modelE.reset, label };
  }

  for (const el of doc.querySelectorAll('p, span, div')) {
    const t = el.textContent.trim();
    const m = t.match(/US\$[\d.]+\s*사용/);
    if (m && t.length < 60) { result.extra_used = m[0]; break; }
  }
  for (const el of doc.querySelectorAll('p, span, div')) {
    const t = el.textContent;
    if (!t.includes('현재 잔액') || t.length > 120) continue;
    let scope = el, hops = 0;
    while (scope && hops < 4) {
      const amounts = scope.textContent.match(/US\$[\d.]+(?:\s*사용)?/g) || [];
      const bal = amounts.find(a => !a.includes('사용'));
      if (bal) { result.extra_balance = bal; break; }
      scope = scope.parentElement; hops++;
    }
    break;
  }

  let plan = '';
  for (const el of doc.querySelectorAll('div[class*="items-start"][class*="justify-between"] *')) {
    const t = el.textContent.trim();
    if (/^Max \(\d+x\)$/.test(t)) { plan = t; break; }
  }
  if (!plan) {
    for (const el of doc.querySelectorAll('p, span, div')) {
      const t = el.textContent.trim();
      const m = t.length < 60 && t.match(/Max \(\d+x\)/);
      if (m) { plan = m[0]; break; }
    }
  }
  if (plan) result.plan = plan;
  result.fetched_at = Date.now();
  return result;
}

// 조회 결과(HTML 또는 오류) 하나를 정규화된 제공자 상태로 바꾼다
function toProviderState(res) {
  const p = providers.get(res.id);
  const base = {
    id: res.id, name: p ? p.name : res.id, accent: p ? p.accent : '#666',
    plan: '', note: '', metrics: [], state: 'error', message: '',
  };
  if (res.error) {
    return Object.assign(base, {
      state: res.error === 'auth' ? 'auth' : 'error',
      message: res.message || res.error,
    });
  }
  // 확장 프로그램이 보낸 값은 이미 파싱돼 있다. 그대로 정규화 상태로 감싼다.
  if (res.fromExtension) {
    return Object.assign(base, {
      state: 'ok', plan: res.plan || '', note: res.note || '', fromExtension: true,
      metrics: (res.metrics || []).map(m => Object.assign({ gauge: true, reset: '', detail: '' }, m)),
    });
  }
  const parsed = providers.parseHtml(res.id, res.html, DOMParser);
  // 지표를 못 찾았는데 인증 쿠키도 없으면 원인은 미로그인이다.
  // (쿠키 개수만으로는 알 수 없다 — 분석·기기 쿠키가 수십 개씩 쌓여 있다)
  if (parsed.state === 'error' && res.authed === false) {
    parsed.state = 'auth';
    parsed.message = '로그인이 필요합니다';
  }
  return parsed;
}

async function loadData(force = false) {
  if (updating) return; // 업데이트·재시작 중에는 데이터 갱신을 건드리지 않는다
  if (!force && cache && (Date.now() - cache.fetched_at) < 5 * 60 * 1000) {
    render(cache);
    return;
  }
  setLoading(true);
  let results;
  try {
    results = await ipcRenderer.invoke('fetch-all', providers.ids);
  } catch (e) {
    results = providers.ids.map(id => ({ id, error: 'unknown', message: e.message }));
  }
  setLoading(false);

  const list = (results || []).map(toProviderState);
  console.table(list.map(p => ({
    제공자: p.name, 상태: p.state, 플랜: p.plan,
    지표: p.metrics.map(m => `${m.label}=${m.gauge === false ? m.value : m.pct + '%'}`).join(', '),
    메시지: p.message,
  })));
  cache = { providers: list, fetched_at: Date.now() };
  render(cache);

  // 하나라도 성공하면 정상으로 본다. 전부 실패했고 그 이유가 로그인 때문이 아니라면 재시도.
  const anyOk   = list.some(p => p.state === 'ok');
  const allAuth = list.length > 0 && list.every(p => p.state === 'auth');
  if (anyOk || allAuth) { resetRetry(); startTimer(); }
  else scheduleRetry();
}

// 평소 쓰는 실제 브라우저에서 사용량 페이지를 새 탭으로 연다.
// 그 페이지에서 확장 프로그램이 값을 읽어 위젯으로 보낸다(= 연결).
async function connectProvider(id) {
  const res = await ipcRenderer.invoke('open-external', id);
  if (res && res.ok) setFooter('브라우저에서 사용량 페이지를 열었습니다 — 확장 프로그램이 값을 가져옵니다');
  else setFooter(`열기 실패: ${(res && res.message) || ''}`);
}

// 계정 전환: 위젯 창이 아니라 평소 쓰는 실제 브라우저에서 계정을 바꾼다.
// 브라우저에서 다른 계정으로 로그인한 뒤 사용량 페이지를 열면, 확장 프로그램이
// 새 계정의 값을 위젯으로 보낸다.
async function switchAccount(id) {
  const p = providers.get(id);
  const name = p ? p.name : id;
  const res = await ipcRenderer.invoke('switch-account', id);
  if (res && res.ok) setFooter(`브라우저에서 ${name} 계정을 전환하세요 — 로그인 후 사용량 페이지를 열면 반영됩니다`);
  else setFooter(`계정 전환 실패: ${(res && res.message) || ''}`);
}

setMode('uni');
loadData(true);
setInterval(() => loadData(false), 5 * 60 * 1000);
</script>
